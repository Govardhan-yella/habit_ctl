name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Expected: ... / Actual: ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS version and whether you ran `npm run dev` or a built build.
      placeholder: "e.g. Chrome 130 on macOS 15, npm run dev"
  - type: textarea
    id: console
    attributes:
      label: Relevant console output
      render: shell
